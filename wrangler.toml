name = "expense-assistant"
main = "src/index.ts"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2024-11-23"

[vars]
ENVIRONMENT = "production"
EMAIL_FORWARDING_DOMAIN = "receipts.inyerm.com"
EMAIL_FORWARDING_READY = "true"
EMAIL_AUTO_POST_READY = "true"
EMAIL_AUTO_POST_AFTER = "2026-10-06T01:45:00Z"
CLOUDFLARE_EMAIL_ZONE_ID = "08eb68367ee4508342d26f223fcb5c2a"
APP_URL = "https://anotto.app"

[observability]
enabled = true

# Monthly usage cleanup and authenticated forwarded-email review.
[triggers]
crons = ["0 3 1 * *", "*/15 * * * *"]
