name = "expense-assistant"
main = "src/index.ts"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2024-11-23"

[vars]
ENVIRONMENT = "production"
# Set EMAIL_FORWARDING_DOMAIN to the enabled Email Routing subdomain.
# Enable subaddressing and route the literal capture@<domain> address to this Worker.
# The Worker receives capture+<random-token>@<domain> in message.to.

[observability]
enabled = true

# Monthly cleanup of old usage records (1st of each month at 3am UTC)
[triggers]
crons = ["0 3 1 * *"]
