name = "expense-assistant"
main = "src/index.ts"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2024-11-23"

[vars]
ENVIRONMENT = "production"
EMAIL_FORWARDING_DOMAIN = "receipts.anotto.app"
EMAIL_FORWARDING_LEGACY_DOMAINS = "receipts.inyerm.com"
EMAIL_FORWARDING_READY = "true"
EMAIL_AUTO_POST_READY = "false"
EMAIL_PDF_INTAKE_READY = "true"
EMAIL_AUTO_POST_AFTER = "2026-10-06T01:45:00Z"
CLOUDFLARE_EMAIL_ZONE_ID = "e579a8358b13aeadf0c5260a7cde3660"
APP_URL = "https://my.anotto.app"

[observability]
enabled = true

[[queues.producers]]
binding = "EMAIL_AUTH_QUEUE"
queue = "anotto-forwarded-email"

[[queues.consumers]]
queue = "anotto-forwarded-email"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 30
retry_delay = 60

# Monthly usage cleanup and authenticated forwarded-email review.
[triggers]
crons = ["0 3 1 * *", "*/15 * * * *"]
