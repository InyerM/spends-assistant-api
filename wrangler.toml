name = "expense-assistant"
main = "src/index.ts"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2024-11-23"

[vars]
ENVIRONMENT = "production"
EMAIL_FORWARDING_DOMAIN = "receipts.inyerm.com"
EMAIL_FORWARDING_READY = "true"
APP_URL = "https://anotto.app"

[observability]
enabled = true

# Monthly cleanup of old usage records (1st of each month at 3am UTC)
[triggers]
crons = ["0 3 1 * *"]
